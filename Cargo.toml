[package]
name = "flaragon"
version = "0.0.5"
edition = "2024"
rust-version = "1.92"
description = "Windows native PHP development environment manager"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "=1.1.10"
tar = "=0.4.46"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18", "system-tray", "raw-window-handle-06"] }
raw-window-handle = "0.6"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "=0.62.2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock", "Win32_System_SystemInformation",
  "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"
  , "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_Common", "Win32_System_Com"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[build-dependencies]
slint-build = "=1.18.1"

[[bin]]
name = "Flaragon"
path = "src/main.rs"

[[bin]]
name = "flaragon-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "flaragon-deploy"
path = "src/bin/deploy.rs"

